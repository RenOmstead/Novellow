# Publishes Novellow to GitHub Pages, only when run by hand.
#
# The site is hosted on Cloudflare Pages (novellow.com), which builds it
# with build.sh on every push to main. This stays as a backup:
# Actions → Publish to GitHub Pages → Run workflow.

name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: bash build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
